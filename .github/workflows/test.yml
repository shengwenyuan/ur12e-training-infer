name: Software checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest==8.4.2
      - run: python -m pytest -q -m 'not backend and not dataset'
      - run: docker compose -f docker/compose.yml --profile robot --profile gpu config --quiet
